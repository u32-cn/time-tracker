<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>学习记录</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="./logs.css">
</head>
<body>
  <div class="app" data-u32-name="app">
    <header class="bar" data-u32-name="titlebar">
      <span class="brand" data-u32-name="brand">学习记录</span>
      <div class="bar-right" data-u32-name="bar-right">
        <button class="icon-btn" id="closeBtn" data-u32-name="close-btn" title="关闭">
          <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.6 2.6l6.8 6.8M9.4 2.6l-6.8 6.8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <div class="summary" data-u32-name="summary">
      <span class="summary-main" id="summaryMain" data-u32-name="summary-main">还没有记录</span>
      <span class="summary-sub" id="summarySub" data-u32-name="summary-sub"></span>
    </div>

    <div class="list" id="list" data-u32-name="list"></div>

    <div class="foot" data-u32-name="foot">
      <span data-u32-name="foot-hint">计时记录可作废或重新启用，补记记录可直接删除</span>
    </div>
  </div>
  <script src="./logs.js"></script>
</body>
</html>
