<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>每日学习计时器</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="./panel.css">
</head>
<body>
  <div class="app" data-u32-name="app">
    <header class="bar" id="bar" data-u32-name="titlebar">
      <span class="brand" data-u32-name="brand">每日学习计时器</span>
      <div class="bar-right" data-u32-name="bar-right">
        <button class="icon-btn" id="logsBtn" data-u32-name="logs-btn" title="学习记录">
          <svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 3.5h10M2 7h10M2 10.5h7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" id="settingsBtn" data-u32-name="settings-btn" title="设置">
          <svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="2.1" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M7 1.4v1.3M7 11.3v1.3M1.4 7h1.3M11.3 7h1.3M3.1 3.1l.9.9M10 10l.9.9M10.9 3.1l-.9.9M4 10l-.9.9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" id="closeBtn" data-u32-name="close-btn" title="关闭">
          <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.6 2.6l6.8 6.8M9.4 2.6l-6.8 6.8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <section class="hero" data-u32-name="hero">
      <div class="hero-label" data-u32-name="hero-label">今日已学</div>
      <div class="hero-value num" id="todayValue" data-u32-name="today-value">0:00:00</div>
      <div class="hero-sub" data-u32-name="hero-sub">
        <span class="chip" id="stateChip" data-u32-name="state-chip">未开始</span>
        <span class="sub" id="todaySub" data-u32-name="today-sub">还没有记录</span>
      </div>
    </section>

    <section class="rest" data-u32-name="rest-card">
      <div class="rest-head" data-u32-name="rest-head">
        <span class="label" data-u32-name="rest-label">最近 45 分钟休息</span>
        <span class="rest-num num" id="restNum" data-u32-name="rest-num">0:00 / 5:00</span>
      </div>
      <div class="rest-track" data-u32-name="rest-track">
        <div class="rest-fill" id="restFill" data-u32-name="rest-fill"></div>
      </div>
      <div class="rest-foot" data-u32-name="rest-foot">
        <span class="rest-hint" id="restHint" data-u32-name="rest-hint">休息够 5 分钟才能继续学</span>
        <span class="rest-threshold-text" data-u32-name="rest-threshold-text">门槛 5:00</span>
      </div>
    </section>

    <section class="control" data-u32-name="control">
      <div class="minutes" id="minutesBox" data-u32-name="minutes-box">
        <input class="minutes-input num" id="minutesInput" type="number" min="1" max="40" step="1" value="40" data-u32-name="minutes-input">
        <span class="minutes-unit" data-u32-name="minutes-unit">分钟</span>
      </div>
      <button class="btn-primary" id="mainBtn" data-u32-name="main-btn">开始学习</button>
      <button class="btn-ghost" id="manualBtn" data-u32-name="manual-btn">补记</button>
    </section>

    <section class="manual" id="manualForm" data-u32-name="manual-form" hidden>
      <div class="manual-row" data-u32-name="manual-row">
        <label class="field" data-u32-name="field-start">
          <span class="field-label" data-u32-name="field-label">开始</span>
          <input type="time" id="manualStart" data-u32-name="manual-start">
        </label>
        <label class="field" data-u32-name="field-end">
          <span class="field-label" data-u32-name="field-label">结束</span>
          <input type="time" id="manualEnd" data-u32-name="manual-end">
        </label>
        <label class="field grow" data-u32-name="field-note">
          <span class="field-label" data-u32-name="field-label">备注</span>
          <input type="text" id="manualNote" maxlength="30" placeholder="读课文、默写…" data-u32-name="manual-note">
        </label>
      </div>
      <div class="manual-actions" data-u32-name="manual-actions">
        <span class="form-msg" id="manualMsg" data-u32-name="manual-msg"></span>
        <button class="btn-ghost small" id="manualCancel" data-u32-name="manual-cancel">取消</button>
        <button class="btn-primary small" id="manualSave" data-u32-name="manual-save">保存补记</button>
      </div>
    </section>

    <section class="block" data-u32-name="timeline-card">
      <div class="block-head" data-u32-name="block-head">
        <span class="label" data-u32-name="timeline-label">今日时间轴</span>
        <span class="legend" data-u32-name="legend">
          <span class="legend-item" data-u32-name="legend-item"><i class="swatch accent"></i>已计入</span>
          <span class="legend-item" data-u32-name="legend-item"><i class="swatch track"></i>未计入</span>
        </span>
      </div>
      <div class="timeline" id="timeline" data-u32-name="timeline"></div>
      <div class="timeline-axis" data-u32-name="timeline-axis">
        <span>0:00</span><span>6:00</span><span>12:00</span><span>18:00</span><span>24:00</span>
      </div>
    </section>

    <section class="block" data-u32-name="week-card">
      <div class="block-head" data-u32-name="block-head">
        <span class="label" data-u32-name="week-label">最近 7 天</span>
        <span class="sub" id="weekSub" data-u32-name="week-sub"></span>
      </div>
      <div class="week" id="week" data-u32-name="week"></div>
    </section>

    <div class="foot" data-u32-name="foot">
      <button class="foot-link" id="logsLink" data-u32-name="logs-link">查看学习记录</button>
    </div>
  </div>

  <div class="sheet" id="settingsSheet" data-u32-name="settings-sheet" hidden>
    <div class="sheet-card" data-u32-name="settings-card">
      <div class="sheet-head" data-u32-name="sheet-head">
        <span class="sheet-title" data-u32-name="sheet-title">设置</span>
        <button class="icon-btn" id="settingsClose" data-u32-name="settings-close">
          <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.6 2.6l6.8 6.8M9.4 2.6l-6.8 6.8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </button>
      </div>
      <label class="row" data-u32-name="row-autolaunch">
        <span>开机自动启动</span>
        <input type="checkbox" id="setAutoLaunch" data-u32-name="set-autolaunch">
      </label>
      <label class="row" data-u32-name="row-sound">
        <span>结束时响铃</span>
        <input type="checkbox" id="setSound" data-u32-name="set-sound">
      </label>
      <div class="row" data-u32-name="row-theme">
        <span>主题</span>
        <div class="seg" id="themeSeg" data-u32-name="theme-seg">
          <button class="seg-btn" data-theme-value="light" data-u32-name="theme-light">亮色</button>
          <button class="seg-btn" data-theme-value="dark" data-u32-name="theme-dark">暗色</button>
        </div>
      </div>
      <div class="row column" data-u32-name="row-fontscale">
        <div class="row-head" data-u32-name="row-head">
          <span>文字大小</span>
          <span class="fs-value num" id="fsValue" data-u32-name="fs-value">100%</span>
        </div>
        <input type="range" id="fsRange" min="80" max="160" step="5" value="120" data-u32-name="fs-range">
      </div>
      <div class="sheet-note" data-u32-name="sheet-note">
        无操作 3 分钟即结束本次计时；最近 45 分钟内休息不足 5 分钟也会结束。这两个阈值固定，不提供调整。
      </div>
    </div>
  </div>

  <script src="./panel.js"></script>
</body>
</html>
